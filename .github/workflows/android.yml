name: Android APK

on:
  push:
    branches: ["claude/realtime-ai-security-system-m6z08v"]
    paths: ["public/**", "capacitor.config.json", "scripts/android-patch.mjs", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Capacitor kurulumu
        run: |
          npm install --no-save --ignore-scripts @capacitor/core@8.6.2 @capacitor/cli@8.6.2 @capacitor/android@8.6.2
          npx cap add android
          node scripts/android-patch.mjs
          npx cap sync android

      - name: APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../GuvenlikAsistani.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GuvenlikAsistani-apk
          path: GuvenlikAsistani.apk

      - name: İndirme bağlantısını güncelle (Release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest GuvenlikAsistani.apk \
            --title "Güvenlik Asistanı – Android" \
            --notes "Telefona kurulacak APK. Kurulum: dosyayı indirip açın, 'bilinmeyen kaynaklardan yükleme' izni isterse verin. Derleme: ${GITHUB_SHA}" \
            --target "${GITHUB_SHA}"
