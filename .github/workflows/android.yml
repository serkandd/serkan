name: Android APK

on:
  push:
    branches: ["claude/realtime-ai-security-system-m6z08v"]
    paths: ["public/**", "capacitor.config.json", "scripts/android-patch.mjs", "scripts/ci/**", "android-signing/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Capacitor kurulumu
        run: |
          npm install --no-save --ignore-scripts @capacitor/core@8.6.2 @capacitor/cli@8.6.2 @capacitor/android@8.6.2 @capacitor/filesystem@8.1.5
          npx cap add android
          node scripts/android-patch.mjs
          npx cap sync android

      - name: Sabit imza anahtarı (yeni sürüm eskisinin üzerine kurulabilsin, veriler korunsun)
        run: |
          mkdir -p ~/.android
          cp android-signing/debug.keystore ~/.android/debug.keystore

      - name: APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../GuvenlikAsistani.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GuvenlikAsistani-apk
          path: GuvenlikAsistani.apk

      - name: İndirme bağlantısını güncelle (Release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest GuvenlikAsistani.apk \
            --title "Güvenlik Asistanı – Android" \
            --notes "Telefona kurulacak APK. Kurulum: dosyayı indirip açın, 'bilinmeyen kaynaklardan yükleme' izni isterse verin. Derleme: ${GITHUB_SHA}" \
            --target "${GITHUB_SHA}"

  emulator-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: GuvenlikAsistani-apk
      - name: KVM etkinleştir
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emülatörde çalıştır
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated
          script: bash scripts/ci/emulator-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-screens
          path: "*.png"
